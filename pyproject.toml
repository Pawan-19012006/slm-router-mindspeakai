[project]
name = "slm-router"
version = "0.1.0"
description = "Local AI Request Classification & Intelligent 3-Way Router"
readme = "README.md"
authors = [
    { name = "Pawan Eswaran", email = "pawaneswaran19012006@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.22.0",
    "python-dotenv>=1.2.3",
    "torch>=2.14.0",
    "transformers>=5.16.1",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

